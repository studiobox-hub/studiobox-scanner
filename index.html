<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Atmoscène — Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin: 15px 0 30px;
    }

    label {
      display: block;
      font-size: 23px;
      font-weight: bold;
      margin-top: 22px;
    }

    select,
    button {
      width: 100%;
      min-height: 70px;
      margin-top: 10px;
      padding: 15px;
      font-size: 21px;
      border-radius: 12px;
      border: 1px solid #999;
      background: white;
    }

    button {
      margin-top: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #message {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    #compteur {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎛️ Atmoscène</h1>

  <label>Prestation</label>

  <select id="prestation" onchange="changerPrestation()">
    <option value="">Chargement des prestations...</option>
  </select>

  <label>Action</label>

  <select id="action">
    <option value="CHARGEMENT">📦 CHARGEMENT</option>
    <option value="RETOUR">🔄 RETOUR</option>
  </select>

  <div id="compteur">
    Sélectionne une prestation
  </div>

  <button onclick="demarrerScanner()">
    📷 SCANNER UN QR CODE
  </button>

  <div id="reader"></div>

  <div id="message">
    Chargement des prestations...
  </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwcNScCHlLnp8vUbA7rRqyATLfHhwO_DavXmBC5oojtDZVLPDeWTJaXuoUwXw-YJ-DQPg/exec";


let scanner = null;


// ==================================================
// CHARGER LES PRESTATIONS
// ==================================================

function chargerPrestations() {

  const script = document.createElement("script");

  const callback = "prestationsCallback";

  script.src =
    APPS_SCRIPT_URL +
    "?action=prestations" +
    "&callback=" +
    callback;

  script.onerror = function() {

    afficherMessage(
      "❌ Impossible de charger les prestations."
    );

  };

  document.body.appendChild(script);
}


// ==================================================
// RÉCEPTION DES PRESTATIONS
// ==================================================

function prestationsCallback(prestations) {

  const select =
    document.getElementById("prestation");

  select.innerHTML =
    '<option value="">Choisir une prestation</option>';

  prestations.forEach(function(p) {

    const option =
      document.createElement("option");

    option.value = p.code;

    option.textContent =
      p.code +
      " — " +
      p.client +
      " — " +
      p.prestation;

    select.appendChild(option);

  });

  afficherMessage("✅ Prêt à scanner");

}


// ==================================================
// CHANGEMENT DE PRESTATION
// ==================================================

function changerPrestation() {

  const prestation =
    document.getElementById("prestation").value;

  if (!prestation) {

    document.getElementById("compteur").textContent =
      "Sélectionne une prestation";

    return;
  }

  document.getElementById("compteur").textContent =
    "📦 Prestation : " + prestation;

}


// ==================================================
// DÉMARRER LE SCANNER
// ==================================================

function demarrerScanner() {

  const prestation =
    document.getElementById("prestation").value;

  if (!prestation) {

    afficherMessage(
      "⚠️ Choisis d'abord une prestation."
    );

    return;
  }

  afficherMessage(
    "📷 Ouverture de la caméra..."
  );

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      }
    },

    function(code) {

      scanner.stop()

        .then(function() {
          traiterCode(code);
        })

        .catch(function() {
          traiterCode(code);
        });

    },

    function(error) {
      // erreurs normales ignorées
    }

  )

  .catch(function(error) {

    afficherMessage(
      "❌ Impossible d'ouvrir la caméra : " +
      error
    );

  });

}


// ==================================================
// TRAITER LE QR
// ==================================================

function traiterCode(code) {

  code =
    code.trim().toUpperCase();

  const formatValide =
    /^[A-Z]{3}-[0-9]{3}$/;

  if (!formatValide.test(code)) {

    afficherMessage(
      "❌ QR INVALIDE : " +
      code +
      " — Format attendu : ABC-123"
    );

    return;
  }

  const prestation =
    document.getElementById("prestation").value;

  const action =
    document.getElementById("action").value;

  afficherMessage(
    "⏳ Enregistrement de " +
    code +
    "..."
  );

  const image =
    new Image();

  image.onload = function() {

    afficherMessage(
      "✅ " +
      code +
      " enregistré — " +
      action
    );

  };

  image.onerror = function() {

    afficherMessage(
      "✅ " +
      code +
      " enregistré — " +
      action
    );

  };

  image.src =
    APPS_SCRIPT_URL +
    "?action=scan" +
    "&prestation=" +
    encodeURIComponent(prestation) +
    "&code=" +
    encodeURIComponent(code) +
    "&type=" +
    encodeURIComponent(action);

}


// ==================================================
// MESSAGE
// ==================================================

function afficherMessage(message) {

  document.getElementById("message")
    .textContent = message;

}


// ==================================================
// LANCEMENT
// ==================================================

chargerPrestations();

</script>

</body>

</html>
